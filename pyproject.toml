[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "voice-assistant-evaluation"
version = "0.1.0"
description = "Evaluation framework for a multi-turn voice assistant using DeepEval."
requires-python = ">=3.14"

dependencies = [
    "anthropic==1.4.0",
    "deepeval==4.2.1",
    "langchain-core==1.6.2",
    "langchain-openai==1.6.0",
    "numpy",
    "openai==3.8.0",
    "python-dotenv==1.2.3",
    "scipy",
    "sounddevice",
]


[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]